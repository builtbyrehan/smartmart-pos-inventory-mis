<svg width="100%" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A140D">
        <animate attributeName="stop-color"
          values="#0A140D;#0F2E1B;#0A140D"
          dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F3D24">
        <animate attributeName="stop-color"
          values="#0F3D24;#145A32;#0F3D24"
          dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A140D">
        <animate attributeName="stop-color"
          values="#0A140D;#0F2E1B;#0A140D"
          dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#39FF88" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#39FF88" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base background -->
  <rect width="1200" height="220" fill="url(#bgGrad)" />
  <rect width="1200" height="220" fill="url(#grid)" />

  <!-- ambient glow, slowly drifting -->
  <circle cx="250" cy="60" r="180" fill="url(#glow)">
    <animate attributeName="cx" values="250;950;250" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- rising particles -->
  <g fill="#39FF88">
    <circle cx="80" cy="200" r="2.5" opacity="0.8">
      <animate attributeName="cy" values="200;-10" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="210" r="2" opacity="0.7">
      <animate attributeName="cy" values="210;-10" dur="6.5s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="205" r="1.6" opacity="0.6">
      <animate attributeName="cy" values="205;-10" dur="4.2s" begin="1.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0" dur="4.2s" begin="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="215" r="2.3" opacity="0.75">
      <animate attributeName="cy" values="215;-10" dur="7s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="740" cy="200" r="2" opacity="0.7">
      <animate attributeName="cy" values="200;-10" dur="5.6s" begin="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="5.6s" begin="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="212" r="1.8" opacity="0.65">
      <animate attributeName="cy" values="212;-10" dur="4.8s" begin="0.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.75;0" dur="4.8s" begin="0.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="205" r="2.4" opacity="0.8">
      <animate attributeName="cy" values="205;-10" dur="6s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1150" cy="210" r="2" opacity="0.7">
      <animate attributeName="cy" values="210;-10" dur="5.2s" begin="1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="5.2s" begin="1.3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- scanning highlight sweep -->
  <rect x="-200" y="0" width="200" height="220" fill="#39FF88" opacity="0.05">
    <animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- title -->
  <text x="600" y="105" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="46" font-weight="700" fill="#39FF88" filter="url(#softGlow)">
    SmartMart POS &amp; Inventory
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
  </text>

  <!-- subtitle -->
  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="17" fill="#D9F7E4" opacity="0.9">
    Secure Transaction-Driven Retail Management Information System
  </text>

  <!-- bottom accent line, animated draw -->
  <line x1="300" y1="175" x2="900" y2="175" stroke="#39FF88" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="600;300;600" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" values="600;900;600" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </line>
</svg>
